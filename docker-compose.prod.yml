# ==========================================
# IntelliConvo - Production Docker Compose with Nginx
# ==========================================
# This configuration includes nginx reverse proxy for production.
# All services are routed through a single port (80/443).
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# With SSL (recommended):
#   1. Place your SSL certificates in ./docker/nginx/ssl/
#   2. Update nginx-ssl.conf with your domain
#   3. Uncomment the nginx-ssl service and comment out nginx
# ==========================================

services:
  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: intelliconvo-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - widget
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      # Uncomment for SSL:
      # - "443:443"
    networks:
      - intelliconvo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: intelliconvo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-intelliconvo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed externally - only accessible within Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-intelliconvo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intelliconvo-network

  # ==========================================
  # Redis Cache & Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: intelliconvo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Not exposed externally - only accessible within Docker network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intelliconvo-network

  # ==========================================
  # Backend API Server
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliconvo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server
      NODE_ENV: production
      PORT: 5001

      # Database (internal Docker network)
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-intelliconvo}

      # Redis (internal Docker network)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Pinecone
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-intelliconvo}
      PINECONE_DIMENSIONS: ${PINECONE_DIMENSIONS:-512}

      # URLs (use your actual domain)
      FRONTEND_URL: ${FRONTEND_URL}
      WIDGET_CDN_URL: ${WIDGET_CDN_URL}

      # OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}

      # Stripe (optional)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_ANNUAL: ${STRIPE_PRICE_ANNUAL:-}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@intelliconvo.ai}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-IntelliConvo}

      # S3-compatible storage (optional - for AWS S3, Railway, R2, etc.)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:-}

      # Admin seeding
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Migrations
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    volumes:
      - uploads_data:/app/uploads
    # Not exposed externally - only accessible via nginx
    expose:
      - "5001"
    networks:
      - intelliconvo-network

  # ==========================================
  # Frontend Next.js Server
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the build - use your production URLs
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WIDGET_URL: ${NEXT_PUBLIC_WIDGET_URL}
    container_name: intelliconvo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    # Not exposed externally - only accessible via nginx
    expose:
      - "3000"
    networks:
      - intelliconvo-network

  # ==========================================
  # Widget Static Server
  # ==========================================
  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile
      args:
        WIDGET_API_URL: ${WIDGET_API_URL}
    container_name: intelliconvo-widget
    restart: unless-stopped
    depends_on:
      - backend
    # Not exposed externally - only accessible via nginx
    expose:
      - "8080"
    networks:
      - intelliconvo-network

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  intelliconvo-network:
    driver: bridge
