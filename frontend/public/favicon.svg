<svg viewBox="0 0 100 100" width="100" height="100" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8" />
      <stop offset="50%"  stop-color="#6466f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="hl" cx="0.3" cy="0.22" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="white" stop-opacity="0.22" />
      <stop offset="100%" stop-color="white" stop-opacity="0"    />
    </radialGradient>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Bubble background -->
  <path d="M 36,4 L 64,4 Q 96,4 96,36 L 96,52 Q 96,84 64,84 L 45,84 L 21,96 L 27,84 L 36,84 Q 4,84 4,52 L 4,36 Q 4,4 36,4 Z" fill="url(#bg)" filter="url(#sh)" />
  <!-- Highlight overlay -->
  <path d="M 36,4 L 64,4 Q 96,4 96,36 L 96,52 Q 96,84 64,84 L 45,84 L 21,96 L 27,84 L 36,84 Q 4,84 4,52 L 4,36 Q 4,4 36,4 Z" fill="url(#hl)" />

  <!-- I bar -->
  <rect x="27" y="30" width="8" height="28" rx="4" fill="white" />

  <!-- Reversed-C arc -->
  <path d="M 49,27 A 18,18 0 1,1 49,61" stroke="white" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Apex dot (outer glow) -->
  <circle cx="73" cy="44" r="7"   fill="white" fill-opacity="0.12" />
  <!-- Apex dot (inner solid) -->
  <circle cx="73" cy="44" r="3.5" fill="white" fill-opacity="0.85" />
</svg>
