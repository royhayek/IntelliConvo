version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: intelligentconvo-postgres
    environment:
      POSTGRES_DB: intelligentconvo
      POSTGRES_USER: intelligentconvo_user
      POSTGRES_PASSWORD: intelligentconvo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligentconvo_user -d intelligentconvo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: intelligentconvo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelligentconvo-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://intelligentconvo_user:intelligentconvo_pass@postgres:5432/intelligentconvo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-here
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      FRONTEND_URL: http://localhost:3000
      WIDGET_CDN_URL: http://localhost:8080
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelligentconvo-frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # Widget Development Server
  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile
    container_name: intelligentconvo-widget
    environment:
      NODE_ENV: development
    ports:
      - "8080:8080"
    volumes:
      - ./widget:/app
      - /app/node_modules
      - /app/dist
    command: npm run serve

volumes:
  postgres_data:
  redis_data: